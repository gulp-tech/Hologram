#
# Встроенные голограммы HolographicDisplays (VoidPe).
#
# Этот файл плагин создаёт сам при первом запуске - правьте его как угодно.
# Формат тот же, что у database.yml: имя голограммы -> lines + position.
# Плагин добавляет любую секцию, если голограммы с таким именем ещё нет, поэтому:
#   * поменяли строку/цену/координаты -> /holograms reload  (или рестарт);
#   * удалили голограмму через /holo delete <имя> -> после рестарта она вернётся из этого файла,
#     чтобы убрать её навсегда - удалите её секцию отсюда (или поставьте builtin-holograms.enabled: false
#     в config.yml);
#   * хотите свою голограмму - добавьте секцию по образцу ниже.
#
# Перенос из DecentHolograms:
#   * кликов не было (actions: {}), переносить нечего;
#   * hex-цвета (&#FFD700) HD не поддерживает (палитра 1.8), поэтому они заменены на ближайшие
#     стандартные коды: &6 золото, &e жёлтый, &b бирюза, &9 синий, &a зелёный, &c красный,
#     &d сиреневый, &5 фиолетовый, &f белый, &7 серый, &8 тёмно-серый;
#   * высота строки (height) в HD не задаётся - промежуток общий: space-between-lines в config.yml;
#   * display-range/update-range -> общий holograms-view-range в config.yml.
#
# Далее это обычные голограммы: /holo edit donate, /holo moveHere donate, /holo delete donate.
#
