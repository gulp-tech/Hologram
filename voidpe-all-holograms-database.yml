#
# Готовая база голограмм HolographicDisplays (файл database.yml) — VoidPe.
#
# В ней 8 голограмм: welcome + 7 перенесённых из DecentHolograms
# (donate, commands, privat_gold, privat_reinforced, privat_emerald_ore,
#  privat_diamond_ore, privat_diamond) — координаты сохранены точно.
#
# ЭТОТ ФАЙЛ НЕ ОБЯЗАТЕЛЕН: в сборке от 2026-10-28 эти 7 голограмм создаются
# сами из plugins/HolographicDisplays/builtin-holograms.yml. Он нужен, только
# если вы хотите поставить всё одним файлом прямо сейчас.
#
# Как поставить:
#   1) остановить сервер и сохранить текущий файл:
#      mv plugins/HolographicDisplays/database.yml plugins/HolographicDisplays/database.yml.bak
#   2) положить ЭТОТ файл как plugins/HolographicDisplays/database.yml
#   3) запустить сервер (или /holograms reload)
#
# Про дубли: plugin/HolographicDisplays/builtin-holograms.yml создаёт голограммы только
# если имени ещё нет в базе. После установки этого файла все 8 имён заняты, поэтому
# builtin-механизм ничего не добавит (и /holo delete donate + рестарт вернут donate из
# builtin-файла — чтобы убрать навсегда, удалите секцию и там).
#
# Формат HD: имя -> lines + position. hex-цвета HD не понимает (палитра 1.8),
# поэтому они заменены на ближайшие legacy-коды. Высота строки не задаётся:
# промежуток общий — space-between-lines в config.yml.
#
# Далее это обычные голограммы: /holo edit donate, /holo moveHere donate, /holo delete donate.
# При любой правке плагин перезапишет этот файл и комментарии уберёт — это нормально.
#
