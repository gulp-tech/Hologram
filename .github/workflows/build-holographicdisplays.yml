name: Build HolographicDisplays

on:
  workflow_dispatch: {}
  push:
    branches:
      - arena/**
    paths:
      - "extracted/**"
      - "ci/**"
      - ".github/workflows/build-holographicdisplays.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build
        run: bash ci/build.sh

      - name: Package and publish results
        if: always()
        run: bash ci/collect.sh

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HolographicDisplays-optimized
          path: dist/
          retention-days: 30
          if-no-files-found: warn
